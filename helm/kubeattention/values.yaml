# KubeAttention Helm Values
# Production configuration for AI-powered Kubernetes scheduler

# Global settings
namespace: kubeattention

# Brain (Python gRPC scoring server)
brain:
  enabled: true
  replicaCount: 1
  image:
    repository: kubeattention/brain
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 50051
  modelType: mlp
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  udsPath: /var/run/kubeattention/brain.sock
  socketDir: /var/run/kubeattention
  modelPath: /models/best_model.pt
  metrics:
    enabled: true
    port: 8080

# Collector (K8s event watcher for training data)
collector:
  enabled: true
  replicaCount: 1
  image:
    repository: kubeattention/collector
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  outputPath: /data/events.jsonl
  outcomeWaitMinutes: 5

# Training job configuration
training:
  enabled: false
  image:
    repository: kubeattention/brain
    tag: latest
    pullPolicy: IfNotPresent
  schedule: "0 2 * * *"  # Daily at 2 AM
  epochs: 50
  batchSize: 32
  learningRate: 0.0001
  dataPath: /data/events.jsonl
  validationDataPath: /data/validation.jsonl
  modelOutputPath: /models
  model: mlp
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# Scheduler plugin configuration
scheduler:
  enabled: true
  name: kubeattention-scheduler
  image:
    repository: kubeattention/scheduler
    tag: latest
    pullPolicy: IfNotPresent
  mode: shadow
  timeoutMs: 50
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# Persistent volume for training data
persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessMode: ReadWriteOnce

# Grafana dashboard
grafana:
  enabled: false
  dashboard:
    enabled: false
    label: grafana_dashboard
    labelValue: "1"


# Service account
serviceAccount:
  create: true
  name: kubeattention
  annotations: {}

# Pod security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

rebalancer:
  enabled: false

# Node selector for Brain pod
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
