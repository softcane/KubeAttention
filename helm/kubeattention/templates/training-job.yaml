{{- if .Values.training.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kubeattention.fullname" . }}-training
  namespace: {{ .Values.namespace }}
  labels:
    app: training
    {{- include "kubeattention.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.training.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: training
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "kubeattention.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: trainer
              image: "{{ .Values.training.image.repository }}:{{ .Values.training.image.tag }}"
              imagePullPolicy: {{ .Values.training.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              command:
                - python
                - brain/training/train.py
                - --train-data
                - {{ .Values.training.dataPath }}
                - --val-data
                - {{ .Values.training.validationDataPath }}
                - --epochs
                - "{{ .Values.training.epochs }}"
                - --batch-size
                - "{{ .Values.training.batchSize }}"
                - --lr
                - "{{ .Values.training.learningRate }}"
                - --output-dir
                - {{ .Values.training.modelOutputPath }}
                - --model
                - {{ .Values.training.model }}
              resources:
                {{- toYaml .Values.training.resources | nindent 16 }}
              volumeMounts:
                - name: training-data
                  mountPath: /data
                - name: models
                  mountPath: /models
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: training-data
              persistentVolumeClaim:
                claimName: {{ include "kubeattention.fullname" . }}-data
            - name: models
              persistentVolumeClaim:
                claimName: {{ include "kubeattention.fullname" . }}-models
            - name: tmp
              emptyDir: {}
{{- end }}
