# Redis Benchmark - Latency-Sensitive Workload
# This is what we're trying to protect from noisy neighbors
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-latency-test
  namespace: benchmark
  labels:
    app: redis-latency-test
    role: latency-sensitive
spec:
  replicas: 4
  selector:
    matchLabels:
      app: redis-latency-test
  template:
    metadata:
      labels:
        app: redis-latency-test
        role: latency-sensitive
      annotations:
        # KubeAttention annotation for high criticality
        kubeattention.io/criticality: "high"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          # Liveness probe to measure responsiveness
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
        
        # Probe container used by benchmark/runner.py for real redis-benchmark calls.
        - name: latency-probe
          image: redis:7-alpine
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
